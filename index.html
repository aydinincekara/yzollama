<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aydın İncekara - Yerel YZ Asistanı</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .chat-container { width: 100%; max-width: 800px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 95vh; }
        
        /* Üst Panel ve Sekmeler */
        .header { background: #333; color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .tabs { display: flex; padding: 10px; background: #eee; border-bottom: 1px solid #ddd; gap: 10px; justify-content: center; }
        .tab-btn { padding: 10px 20px; border: 1px solid #ccc; border-radius: 5px; background: white; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: #007bff; color: white; border-color: #0056b3; }
        
        /* Sohbet Alanı */
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #fafafa; }
        .message { max-width: 85%; padding: 12px 18px; border-radius: 15px; line-height: 1.6; font-size: 15px; position: relative; }
        .user-msg { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background: #e9ecef; color: #222; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #dee2e6; }
        
        /* Kod Blokları İçin Basit Stil */
        pre { background: #272822; color: #f8f8f2; padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 14px; }
        
        /* Giriş Alanı */
        .input-area { display: flex; padding: 20px; background: white; border-top: 1px solid #ddd; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; outline: none; font-size: 16px; }
        button.send-btn { padding: 12px 25px; margin-left: 10px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button.send-btn:hover { background: #218838; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">Yerel Yapay Zeka Laboratuvarı</div>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="modelSec(this, 'gemma')">💬 Chat (Gemma)</button>
        <button class="tab-btn" onclick="modelSec(this, 'Kod_Uzmani')">💻 Coding (Llama3)</button>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">Sistem hazır. Lütfen bir model seçin ve sorunuzu yazın.</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Mesajınızı yazın..." onkeypress="if(event.key === 'Enter') mesajGonder()">
        <button class="send-btn" onclick="mesajGonder()">Gönder</button>
    </div>
</div>

<script>
    // 1. AYAR: Senin güncel Ngrok adresin
    const NGROK_URL = "https://uncurious-blurry-affiliate.ngrok-free.dev";
    
    let aktifModel = "gemma";

    // Sekme Değiştirme Fonksiyonu
    function modelSec(buton, modelAdi) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        buton.classList.add('active');
        aktifModel = modelAdi;
        ekranaYazdir("Sistem", `Mod geçişi yapıldı: <b>${aktifModel}</b> aktif.`, "ai-msg");
    }

    // Ana Mesaj Gönderme Fonksiyonu
    async function mesajGonder() {
        const inputField = document.getElementById("userInput");
        const mesaj = inputField.value.trim();
        if (!mesaj) return;

        ekranaYazdir("Sen", mesaj, "user-msg");
        inputField.value = "";

        const loadingId = ekranaYazdir("Asistan", "Düşünüyor...", "ai-msg");

        try {
            const response = await fetch(`${NGROK_URL}/api/generate`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    // KRİTİK: Ngrok'un tarayıcı uyarı sayfasını bypass eder
                    'ngrok-skip-browser-warning': 'true' 
                },
                body: JSON.stringify({
                    model: aktifModel,
                    prompt: mesaj,
                    stream: false
                })
            });

            if (!response.ok) throw new Error("Sunucu yanıt vermedi.");

            const data = await response.json();
            document.getElementById(loadingId).innerText = data.response;

        } catch (error) {
            document.getElementById(loadingId).innerText = "Hata: Kasa ile bağlantı kurulamadı. Ngrok veya Ollama kapalı olabilir.";
            console.error("Hata Detayı:", error);
        }
    }

    // Arayüze Baloncuk Ekleme
    function ekranaYazdir(gonderen, metin, sinif) {
        const chatBox = document.getElementById("chatBox");
        const div = document.createElement("div");
        const id = "msg_" + Math.random().toString(36).substr(2, 9);
        div.id = id;
        div.className = `message ${sinif}`;
        div.innerHTML = metin.replace(/\n/g, '<br>'); // Satır başlarını koru
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return id;
    }
</script>

</body>
</html>
